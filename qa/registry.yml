      reservation_initial_state: pendiente
      reservation_total: "100.00"
      approved_before: "0.00"
      net_approved_before: "0.00"
      payment_attempt: "HTTP 201 / code null"
      payment_persisted: true
      payment_method: efectivo
      payment_state: aprobado
