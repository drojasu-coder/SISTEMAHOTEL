        refund aprobado; pago reembolsado_parcial; reembolsos aprobados Q40.00;
        neto Q60.00; capacidad de segundo reembolso Q60.00
      after_old_refund_created_pending: >-
        sin cambios: refund aprobado; pago reembolsado_parcial; neto Q60.00
      after_old_refund_failed: >-
        sin cambios: refund aprobado; pago reembolsado_parcial; neto Q60.00
      after_second_refund_60: >-
