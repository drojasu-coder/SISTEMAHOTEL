      lock -> UPDATE de Habitación. POST de ReservaHabitacion usa Habitación ->
      disponibilidad -> INSERT, por lo que ambos flujos se serializan sobre la
      misma fila. PATCH de ReservaHabitacion conserva el orden corregido en
      QA-RH-CONC-CANDIDATE-023: ReservaHabitacion origen -> Habitación destino ->
      disponibilidad -> UPDATE. La nueva ruta no toma locks de reservas después
      del lock de habitación, evitando invertir ese orden.
