      total: "1 failed, 1 skipped; esperado reembolsado, recibido aprobado"
      partial: "1 failed, 1 skipped; esperado reembolsado_parcial, recibido aprobado"
    root_cause: >-
      Para payment_intent.succeeded, target era aprobado y shouldUpdate permitía
      actualizar cualquier estado distinto de aprobado, incluidos reembolsado y
