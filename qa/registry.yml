      source_of_truth: PostgreSQL
      before_maintenance: >-
        habitación id=1 estado=disponible; reserva id=1 habitacion_id=1,
        2026-10-24/2026-10-26, estado=pendiente.
      after_maintenance: >-
        habitación id=1 estado=mantenimiento; reserva id=1 habitacion_id=1,
        2026-10-24/2026-10-26, estado=pendiente.
      reservation_unchanged: true
      reservation_assignment_preserved: true
      automatic_cancellation: false
      automatic_reassignment: false
      cleaning_subcase: >-
        habitación id=2 estado=limpieza aceptó por API la reserva id=2,
        habitacion_id=2, 2026-10-24/2026-10-26, estado=pendiente.
    suspected_execution_path: >-
      habitacion.routes PATCH /:id -> habitacion.controller.updateHabitacion ->
      habitacion.service.updateHabitacion. El servicio obtiene la Habitación,
      valida únicamente referencias y unicidad cuando corresponden, y ejecuta
      habitacion.update(data) sin consultar reservas_habitacion futuras en
      estado pendiente o confirmada. Por ello persiste mantenimiento y deja la
      reserva futura intacta y asociada.
    root_cause: >-
      updateHabitacion no tenía una regla de transición a mantenimiento ni una
      transacción que serializara esa transición con la creación o el traslado
      de reservas. Persistía estado=mantenimiento sin consultar reservas activas
      cuya fecha_salida aún fuera posterior a la fecha local del hotel.
    correction: >-
      updateHabitacion ahora ejecuta el flujo completo dentro de una transacción,
      bloquea la Habitación objetivo con SELECT FOR UPDATE y, únicamente en una
      transición efectiva hacia mantenimiento, consulta reservas de esa misma
      habitación en estado pendiente o confirmada con fecha_salida posterior a
      la fecha local actual. Ante conflicto lanza AppError HTTP 409
      ROOM_HAS_FUTURE_RESERVATIONS antes del UPDATE. No cancela, reasigna ni
      modifica reservas; limpieza conserva su comportamiento.
    concurrency: >-
      La ruta de Habitación usa Habitación objetivo -> consulta de reservas sin
      lock -> UPDATE de Habitación. POST de ReservaHabitacion usa Habitación ->
      disponibilidad -> INSERT, por lo que ambos flujos se serializan sobre la
      misma fila. PATCH de ReservaHabitacion conserva el orden corregido en
      QA-RH-CONC-CANDIDATE-023: ReservaHabitacion origen -> Habitación destino ->
      disponibilidad -> UPDATE. La nueva ruta no toma locks de reservas después
      del lock de habitación, evitando invertir ese orden.
    severity_recommendation: medium
