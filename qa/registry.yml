  - id: QA-ADMIN-SPA-CITA-FUNC-005
    status: corrected
    manual_revalidation: pending
    severity: medium
    category: FUNC
    invariant: >-
      El GET administrativo de la coleccion de citas de Spa debe exponer para
      cada cita la asociacion contractual Terapeuta, limitada a nombre y activo,
      y no la clave interna Terapeutum. Cuando terapeuta_id sea null debe exponer
      Terapeuta: null. Listado y detalle deben representar igual la asociacion,
      sin alterar las asociaciones Usuario y ServicioBienestar ni el orden fecha
      DESC, hora_inicio DESC.
    reproduction:
      phase: RED
      database: hotel_test_db
      test_file: backend/tests/bienestar/citaSpa.adminList.test.ts
      test_names:
        - "QA-ADMIN-SPA-CITA-FUNC-005 A1: listado admin normaliza cada terapeuta y coincide con PostgreSQL y detalle"
        - "QA-ADMIN-SPA-CITA-FUNC-005 A2: listado admin conserva fecha DESC y hora_inicio DESC"
        - "QA-ADMIN-SPA-CITA-FUNC-005 A3: listado admin serializa Terapeuta null cuando la FK nullable no tiene asignacion"
        - "QA-ADMIN-SPA-CITA-FUNC-005 A4: cliente no puede listar citas globales ni recibe datos"
      command: >-
        npm --prefix backend test -- tests/bienestar/citaSpa.adminList.test.ts -t
        "QA-ADMIN-SPA-CITA-FUNC-005" --reporter=verbose
      endpoint: GET /api/citas-spa
    expected:
      collection_http_status: 200
      therapist_property: Terapeuta
      therapist_attributes:
        - nombre
        - activo
      internal_property_Terapeutum: absent
      nullable_therapist: "Terapeuta: null"
      detail_consistency: preserved
      collection_order:
        - "fecha DESC"
        - "hora_inicio DESC"
      client_access: "403 INSUFFICIENT_PERMISSIONS without data"
    actual_before_fix:
      collection_http_status: 200
      assigned_therapist_property: Terapeutum
      expected_property_Terapeuta: absent
      nullable_therapist: "Terapeutum: null"
      usuario_and_servicio_bienestar: correct
      detail_therapist_property: Terapeuta
      collection_order: correct
      client_access: "403 INSUFFICIENT_PERMISSIONS without data"
      red_result: "2 failed, 2 passed"
    root_cause: >-
      Sequelize infiere Terapeutum como nombre de la asociacion belongsTo con el
      modelo Terapeuta. getById ya serializaba y renombraba esa clave, pero
      getAll devolvia directamente las instancias de findAll, por lo que el
      contrato variaba entre coleccion y detalle, incluido el caso nullable.
    correction: >-
      Se extrajo una normalizacion compartida que serializa cada instancia,
      publica Terapeuta con el valor de Terapeutum o null y elimina la clave
      interna. getAll mantiene una sola llamada findAll con el include y orden
      existentes y aplica la normalizacion en memoria; getById reutiliza la
      misma funcion. No se ampliaron las proyecciones ni se agregaron consultas.
    concurrency: >-
      Es una correccion de serializacion posterior a consultas de lectura; no
      agrega escrituras, transacciones, locks, restricciones, N+1 ni ventanas
      check-then-write, y no modifica reglas concurrentes o financieras.
    regression_test:
      test_file: backend/tests/bienestar/citaSpa.adminList.test.ts
      authored_by: qa-test-author
      modified_by_fixer: false
    verification:
