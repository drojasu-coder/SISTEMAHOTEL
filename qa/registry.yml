      ReservaHabitacion futura activa. El endpoint administrativo debe responder
      HTTP 409 ROOM_HAS_FUTURE_RESERVATIONS y conservar tanto el estado de la
      habitación como la reserva y su asociación. Limpieza, por ser temporal, no
      bloquea por sí sola la creación de una reserva futura válida.
