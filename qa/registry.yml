  - id: QA-AUTH-SEC-CANDIDATE-034
    status: closed
    severity: medium
    category: SECURITY
    title: >-
      Login y registro públicos carecen de límite de solicitudes por IP
    approved_product_rule:
      login: { max_requests: 10, window_minutes: 15 }
      register: { max_requests: 5, window_minutes: 30 }
      scope: { key: IP }
      response: { http: 429, code: TOO_MANY_REQUESTS }
      storage_current_architecture: in_memory
      future_distributed_architecture: Redis_or_gateway_WAF
    invariant: >-
      Desde una misma IP, POST /api/auth/login admite como máximo 10 solicitudes
      en 15 minutos y la solicitud 11 responde HTTP 429 TOO_MANY_REQUESTS. POST
      /api/auth/register admite como máximo 5 solicitudes en 30 minutos y la
      solicitud 6 responde HTTP 429 TOO_MANY_REQUESTS sin crear un usuario.
    reproduction:
      phase: RED
      database: hotel_test_db
      test_file: backend/tests/auth/authRateLimit.test.ts
      test_name: "QA-AUTH-SEC-CANDIDATE-034: limita login y register por IP"
      command: >-
        npm --prefix backend test -- tests/auth/authRateLimit.test.ts
      request_mode: sequential_and_rapid
      request_ip: NOT_OBSERVABLE
      x_forwarded_for_used: false
      real_waits_used: false
      stripe_used: false
      payments_used: false
      cart_used: false
    expected:
      login_first_10: "10x HTTP 401 INVALID_CREDENTIALS"
      login_request_11: "HTTP 429 TOO_MANY_REQUESTS"
      register_first_5: "5x HTTP 201"
      register_request_6: "HTTP 429 TOO_MANY_REQUESTS"
      persisted_register_users: 5
      unexpected_500: false
    actual:
      login_first_10: "10x HTTP 401 INVALID_CREDENTIALS"
      login_request_11: "HTTP 401 INVALID_CREDENTIALS"
      login_request_11_reached_auth_flow: true
      bcrypt_compare_calls: NOT_OBSERVABLE
      register_first_5: "5x HTTP 201"
      register_request_6: "HTTP 201; code null"
      register_request_6_reached_register_flow: true
      persisted_register_users: 6
      users_created_before_cleanup: 7
      users_created_detail: "1 fixture de login y 6 usuarios por register"
      unexpected_500: false
      rate_limit_currently_present: false
      login_limit_violation: true
      register_limit_violation: true
      red_result: >-
        1 archivo falló, 1 test falló con 5 aserciones soft: login 11 no devolvió
        429/código esperado, register 6 no devolvió 429/código esperado y el sexto
        usuario quedó persistido en PostgreSQL.
    http_evidence:
      login_requests_executed: 11
      login_first_10_distribution: "401=10"
      login_request_11_status: 401
      login_request_11_code: INVALID_CREDENTIALS
      register_requests_executed: 6
      register_first_5_distribution: "201=5"
      register_request_6_status: 201
      register_request_6_code: null
      unexpected_500: false
    database_evidence:
      source_of_truth: PostgreSQL
      login_fixture_email: qa034-login@example.test
      register_emails_persisted:
        - qa034-register-01@example.test
        - qa034-register-02@example.test
        - qa034-register-03@example.test
        - qa034-register-04@example.test
        - qa034-register-05@example.test
        - qa034-register-06@example.test
      test_users_before_cleanup: 7
      test_users_after_cleanup: 0
      cleanup: pass
    suspected_execution_path: >-
      app monta authRoutes directamente en /api/auth. POST /login ejecuta
      validateBody y authController.login, que alcanza auth.service.login y
      bcrypt.compare en cada credencial incorrecta. POST /register ejecuta
      validateBody y authController.register, que alcanza auth.service.register,
      genera el hash y crea cada Usuario. Las rutas no interponen middleware de
      rate limiting ni mantienen contadores por req.ip, por lo que todas las
      solicitudes llegan al flujo de autenticación o registro.
    root_cause: >-
      Las rutas públicas POST /api/auth/login y POST /api/auth/register no tenían
      un middleware previo a la validación y al controlador que contabilizara y
      limitara solicitudes por req.ip; por ello cada intento alcanzaba los flujos
      costosos de autenticación o creación de usuario.
    correction: >-
      Se agregó un factory de rate limiting con ventanas fijas y almacenamiento
      en memoria por instancia, clave req.ip, reloj inyectable y limpieza
