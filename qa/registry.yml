findings:
  - id: QA-RA-FIN-CANDIDATE-001
    status: closed
    severity: high
    category: FIN
    invariant: >-
      El total de una reserva de actividad debe calcularse con la tarifa
      persistida del recurso multiplicada por la duración reservada; para una
      hora con precio_hora 100.00, sin equipo ni instructor, debe ser 100.00.
    reproduction:
      test_file: backend/tests/actividades/reservaActividad.test.ts
      test_name: "QA-RA-FIN-CANDIDATE-001: persiste la tarifa por una hora de actividad"
      command: >-
        npm test -- tests/actividades/reservaActividad.test.ts -t
        "QA-RA-FIN-CANDIDATE-001: persiste la tarifa por una hora de actividad"
    expected:
      http_total: "100.00"
      database_total: "100.00"
    actual_before_fix:
      http_total: "0.00"
      database_total: "0.00"
    endpoint: POST /api/reservas-actividad
    root_cause: >-
      El método create obtenía y bloqueaba RecursoActividad, pero descartaba
      el registro y no calculaba ni enviaba total a ReservaActividad.create;
      por ello Sequelize persistía el valor predeterminado 0.00.
    correction: >-
      create conserva el recurso bloqueado, calcula dentro de la transacción
      precio_hora por la duración en horas, redondea a dos decimales y
      persiste el resultado como total, sin añadir cargos de equipo o instructor.
    regression_test:
      test_file: backend/tests/actividades/reservaActividad.test.ts
      test_name: "QA-RA-FIN-CANDIDATE-001: persiste la tarifa por una hora de actividad"
    final_verification:
      database: hotel_test_db
      focused: "1 passed, 44 skipped"
      related: "45 passed"
      typecheck: green
      full_backend: "341 passed"
      regression: green
      new_failures: none

  - id: QA-RA-FIN-CANDIDATE-002
    status: closed
    severity: high
    category: FIN
    invariant: >-
      Una ReservaActividad propia, válida y con total calculado por el backend
      debe poder agregarse al carrito usando exclusivamente su total persistido
      como precio del ítem.
    reproduction:
      test_file: backend/tests/carrito/carritoItem.test.ts
      test_name: "QA-RA-FIN-CANDIDATE-002: agrega al carrito una reserva de actividad usando su total persistido"
      command: >-
        npm test -- tests/carrito/carritoItem.test.ts -t
        "QA-RA-FIN-CANDIDATE-002: agrega al carrito una reserva de actividad usando su total persistido"
    expected:
      http_status: 201
      item_price: "100.00"
    actual_before_fix:
      http_status: 422
      error_code: ITEM_PRICE_NOT_AVAILABLE
      database_item_count: 0
    endpoint: POST /api/carritos/{id}/items
    root_cause: >-
      resolveActividad lanzaba incondicionalmente ITEM_PRICE_NOT_AVAILABLE
      después de validar existencia, ownership y estado de la reserva.
    correction: >-
      resolveActividad usa ReservaActividad.total mediante normalizePrice como
      precio confiable del backend, preservando las validaciones de existencia,
      ownership y estado y sin aceptar un precio controlado por el cliente.
    regression_test:
      test_file: backend/tests/carrito/carritoItem.test.ts
      test_name: "QA-RA-FIN-CANDIDATE-002: agrega al carrito una reserva de actividad usando su total persistido"
    final_verification:
      database: hotel_test_db
      focused: "1 passed, 39 skipped"
      cart_related: "40 passed"
      reserva_actividad: "45 passed"
      typecheck: green
      full_backend: "342 passed"
      ownership_regression: green
      state_validation_regression: green
      client_controlled_price: rejected
      regression: green
      new_failures: none

  - id: QA-RA-FUNC-CANDIDATE-003
    status: closed
    severity: medium
    category: FUNC
    invariant: >-
      Un administrador autenticado debe poder configurar precio_hora,
      precio_equipo y precio_instructor_hora al crear o actualizar un recurso
      de actividad, y las tarifas no negativas deben persistirse exactamente.
    reproduction:
      test_file: backend/tests/actividades/recursoActividad.test.ts
      test_names:
        - "QA-RA-FUNC-CANDIDATE-003 CREATE: admin configura tarifas al crear recurso"
        - "QA-RA-FUNC-CANDIDATE-003 UPDATE: admin configura tarifas al actualizar recurso"
      commands:
        - >-
          npm test -- tests/actividades/recursoActividad.test.ts -t
          "QA-RA-FUNC-CANDIDATE-003 CREATE: admin configura tarifas al crear recurso"
        - >-
          npm test -- tests/actividades/recursoActividad.test.ts -t
          "QA-RA-FUNC-CANDIDATE-003 UPDATE: admin configura tarifas al actualizar recurso"
    expected:
      create_http_status: 201
      create_database_tariffs: "100.00/25.00/50.00"
      update_http_status: 200
      update_database_tariffs: "150.00/30.00/60.00"
    actual_before_fix:
      create_http_status: 400
      create_error_code: VALIDATION_ERROR
      update_http_status: 400
      update_error_code: VALIDATION_ERROR
      update_database_tariffs: "0.00/0.00/0.00"
    endpoints:
      - POST /api/recursos-actividad
      - PATCH /api/recursos-actividad/{id}
    root_cause: >-
      Los esquemas strict de CREATE y UPDATE no declaraban los tres campos de
      tarifa ya existentes en RecursoActividad, por lo que el middleware los
      rechazaba antes del controller. Además, el servicio enviaba el objeto de
      entrada completo al modelo en lugar de construir una lista explícita de
      campos administrables.
    correction: >-
      Los esquemas strict ahora admiten opcionalmente las tres tarifas como
      números finitos y no negativos. El servicio selecciona explícitamente los
      campos permitidos para CREATE y UPDATE y vuelve a consultar el recurso
      actualizado para responder con la representación decimal persistida.
    regression_test:
      test_file: backend/tests/actividades/recursoActividad.test.ts
      create_test: "QA-RA-FUNC-CANDIDATE-003 CREATE: admin configura tarifas al crear recurso"
      update_test: "QA-RA-FUNC-CANDIDATE-003 UPDATE: admin configura tarifas al actualizar recurso"
    final_verification:
      database: hotel_test_db
      create_focused: "1 passed, 1 skipped"
      update_focused: "1 passed, 1 skipped"
      recurso_actividad: "2 passed"
      reserva_actividad: "45 passed"
      cart_item: "40 passed"
      typecheck: green
      full_backend: "344 passed"
      strict_validation: green
      unknown_field_rejection: green
      negative_price_rejection: green
      mass_assignment_regression: green
      admin_authorization: preserved
      migrations_modified: false
      regression: green
      new_failures: none
