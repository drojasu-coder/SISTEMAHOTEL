  - id: QA-RA-FUNC-CANDIDATE-004
    status: closed
    severity: medium
    category: FUNC
    invariant: >-
      Una ReservaActividad solo puede pasar de confirmada a completada cuando su
      fecha y hora_fin sean menores o iguales al momento actual. Si todavía no ha
      finalizado, el endpoint administrativo debe rechazar la transición con HTTP
      409 y código RESERVATION_NOT_FINISHED, conservar estado confirmada y mantener
      bloqueada la disponibilidad del recurso y, cuando aplique, del instructor.
    approved_product_rule:
      completed_is_terminal: true
      completed_to_confirmed_allowed: false
      completed_to_canceled_allowed: false
      temporal_transition: "confirmada->completada requiere fecha+hora_fin <= ahora"
      future_transition_error: "HTTP 409 / RESERVATION_NOT_FINISHED"
      preserves_historical_payments: true
      creates_automatic_refund: false
      allows_new_payments: false
      red_scope: >-
        Este RED temporal inicial solo ejercita el rechazo de completar una
        reserva futura; la terminalidad y los efectos financieros aprobados no
        se amplían todavía en esta reproducción.
    reproduction:
      phase: RED
      database: hotel_test_db
      test_file: backend/tests/actividades/reservaActividad.lifecycle.test.ts
      test_name: "QA-RA-FUNC-CANDIDATE-004: rechaza completar una reserva cuya actividad todavía no ha finalizado"
      command: >-
        npm --prefix backend test --
        tests/actividades/reservaActividad.lifecycle.test.ts -t
        "QA-RA-FUNC-CANDIDATE-004: rechaza completar una reserva cuya actividad todavía no ha finalizado"
      dynamic_scenario: "fecha local del hotel + 2 días, 10:00-11:00"
    expected:
      completion_http_status: 409
      completion_error_code: RESERVATION_NOT_FINISHED
      persisted_state_after_attempt: confirmada
      resource_availability_still_blocked: true
      instructor_availability: N/A
    actual_before_fix:
      reservation_date: "2026-10-24"
      completion_http_status: 200
      completion_error_code: null
      persisted_state_after_attempt: completada
      overlapping_resource_probe_http_status: 201
      resource_availability_still_blocked: false
      instructor_availability: N/A
    http_evidence: >-
      La reserva fue creada por POST /api/reservas-actividad en estado confirmada
      y un traslape previo recibió HTTP 409 RESOURCE_OVERLAP. PATCH
      /api/reservas-actividad/{id}/estado con estado completada recibió HTTP 200;
      después, un POST idéntico recibió HTTP 201.
    database_evidence: >-
      Una consulta directa de ReservaActividad confirmó estado confirmada antes
      del PATCH y estado completada después del intento futuro aceptado.
    endpoint: PATCH /api/reservas-actividad/{id}/estado
    suspected_execution_path: >-
      reservaActividad.routes -> reservaActividad.controller.updateStatus ->
      reservaActividad.service.update; la actualización transaccional valida
      fecha y horario solo al reactivar hacia confirmada y persiste directamente
      la transición confirmada->completada sin comprobar fecha+hora_fin.
    red_result: >-
      1 failed con cinco aserciones de evidencia: HTTP 200 en lugar de 409, código
      ausente, estado completada en lugar de confirmada y recurso liberado, que
      permitió crear un traslape con HTTP 201.
    scope: >-
      Este RED inicial cubre exclusivamente el rechazo de completar una reserva
      futura; no prueba pagos, otros efectos financieros ni terminalidad.
    classification: BACKEND DEFECT
    confidence: HIGH

  - id: QA-RA-FUNC-CANDIDATE-005
    status: closed
    severity: medium
    category: FUNC
    invariant: >-
      InstructorActividad no puede desactivarse mientras tenga al menos una
      ReservaActividad futura activa asignada en estado confirmada. Antes debe
      reasignarse o cancelarse explícitamente; la desactivación nunca cancela,
      desasigna ni reasigna reservas automáticamente.
    approved_product_rule:
      future_active_reservations_block_deactivation: true
      automatic_reservation_cancellation: false
      historical_relations_preserved: true
      inactive_instructor_assignable_to_new_reservations: false
    reproduction:
      phase: RED
      database: hotel_test_db
      test_file: backend/tests/actividades/instructorActividad.lifecycle.test.ts
      test_name: "QA-RA-FUNC-CANDIDATE-005: rechaza desactivar un instructor con una reserva futura confirmada"
      command: >-
        npm --prefix backend test --
        tests/actividades/instructorActividad.lifecycle.test.ts -t
        "QA-RA-FUNC-CANDIDATE-005: rechaza desactivar un instructor con una reserva futura confirmada"
      dynamic_scenario: "fecha local del hotel + 2 días, 10:00-11:00"
    expected:
      deactivation_http_status: 409
      deactivation_error_code: INSTRUCTOR_HAS_FUTURE_RESERVATIONS
      instructor_active_after_attempt: true
      reservation_state_after_attempt: confirmada
      reservation_assignment_preserved: true
      automatic_cancellation: false
      automatic_unassign: false
      automatic_reassignment: false
    actual_before_fix:
      reservation_date: "2026-10-24"
      deactivation_http_status: 200
      deactivation_error_code: null
      instructor_active_after_attempt: false
      reservation_state_after_attempt: confirmada
      reservation_instructor_preserved: true
      automatic_cancellation: false
      automatic_unassign: false
      automatic_reassignment: false
      inactive_instructor_with_future_confirmed_reservation: true
    http_evidence: >-
      Una reserva con instructor activo fue creada por POST
      /api/reservas-actividad con HTTP 201 en estado confirmada. PATCH
      /api/instructores/{id} con activo=false recibió HTTP 200 sin código de
      conflicto, en lugar de HTTP 409 INSTRUCTOR_HAS_FUTURE_RESERVATIONS.
    database_evidence: >-
      Consultas directas de PostgreSQL confirmaron antes del intento instructor
      activo=true, reserva confirmada e instructor_id asignado. Después del PATCH,
      el instructor quedó activo=false mientras la reserva futura continuó
      confirmada con el mismo instructor_id; no hubo cancelación, desasignación ni
      reasignación automática.
    endpoint: PATCH /api/instructores/{id}
    suspected_execution_path: >-
      instructor.routes -> instructor.controller.update ->
      instructor.service.update; el servicio obtiene el instructor y ejecuta
      instructor.update(data) sin comprobar reservas futuras confirmadas.
    red_result: >-
      1 test failed con tres aserciones de evidencia: HTTP 200 en lugar de 409,
      código INSTRUCTOR_HAS_FUTURE_RESERVATIONS ausente e instructor persistido
      inactivo en lugar de activo. La reserva permaneció confirmada y asignada al
      instructor ya inactivo.
    scope: >-
      Este RED cubre exclusivamente activo true->false con una reserva futura
      confirmada. Se documenta, sin ampliar el RED, que canceladas, completadas
      legítimas e históricas finalizadas no bloquean; un instructor inactivo no es
      asignable/reactivable/reasignable y las relaciones históricas se preservan.
    classification: BACKEND DEFECT
    confidence: HIGH
    root_cause: >-
      instructor.service.update persistía activo=false sin una transacción, sin
      bloquear la fila del instructor y sin consultar reservas confirmadas cuya
      fecha y hora_fin todavía requirieran la prestación futura del instructor.
    correction: >-
      La actualización administrativa ahora bloquea Instructor con SELECT FOR
      UPDATE dentro de una transacción y, exclusivamente en la transición
      activo=true a activo=false, consulta reservas confirmadas asignadas cuya
      fecha sea posterior a la fecha local del hotel o cuya fecha sea hoy y
      hora_fin sea posterior a la hora local. Si existe alguna, revierte con HTTP
      409 e INSTRUCTOR_HAS_FUTURE_RESERVATIONS sin modificar instructor ni
      reserva. La zona horaria usa APP_TIMEZONE con America/Guatemala como valor
      predeterminado, de forma coherente con QA-RA-FUNC-CANDIDATE-004.
    final_verification:
      database_guard: hotel_test_db
      instructor_lifecycle: "1 passed"
      reserva_actividad: "45 passed"
      reserva_actividad_lifecycle_qa_004: "1 passed"
      typecheck: green
      deactivation_http_status: 409
      deactivation_error_code: INSTRUCTOR_HAS_FUTURE_RESERVATIONS
      instructor_active_after_attempt: true
      reservation_state_after_attempt: confirmada
      reservation_assignment_preserved: true
      automatic_cancellation: false
      automatic_unassign: false
      automatic_reassignment: false

  - id: QA-PAY-FIN-CANDIDATE-007
    status: closed
    severity: critical
    category: FIN
    invariant: >-
      Los pagos aprobados netos más la exposición de pagos con tarjeta en estado
      procesando para un mismo origen no deben superar su total; veinte intentos
      concurrentes sobre un carrito de Q100.00 solo pueden comprometer Q100.00.
    reproduction:
      test_file: backend/tests/pagos/pagoActividad.concurrency.test.ts
      test_name: "QA-PAY-FIN-CANDIDATE-007: limita a una sola exposición pendiente el pago concurrente del mismo carrito"
      command: >-
        npm test -- tests/pagos/pagoActividad.concurrency.test.ts -t
        "QA-PAY-FIN-CANDIDATE-007: limita a una sola exposición pendiente el pago concurrente del mismo carrito"
      stripe_mode: mock_local
      concurrent_requests: 20
    expected:
      successful_requests: 1
      payment_intents_created: 1
      pending_exposure: "100.00"
      approved_amount: "0.00"
      exposure_violation: false
    actual_before_fix:
      successful_requests: 20
      payment_intents_created: 20
      processing_payments: 20
      pending_exposure: "2000.00"
      approved_amount: "0.00"
      exposure_violation: true
    endpoint: POST /api/pagos
    root_cause: >-
      El bloqueo FOR UPDATE del carrito serializaba createPago, pero cada
      transacción calculaba el saldo únicamente con approvedAmount, que excluye
      correctamente pagos procesando. Después de cada commit, la siguiente
      transacción volvía a observar aprobado neto igual a cero y podía crear otro
      PaymentIntent por el saldo completo.
    correction: >-
      createPago calcula exclusivamente el monto nuevo que puede comprometer con
      un helper separado que suma el aprobado neto y pagos en estado procesando
      consultados dentro de la transacción serializada por el lock del origen, sin
      bloquear las filas procesando. No se modificó approvedAmount ni se incluyeron
      transferencias pendientes, pagos rechazados o cancelados.
    regression_test:
      test_file: backend/tests/pagos/pagoActividad.concurrency.test.ts
      test_name: "QA-PAY-FIN-CANDIDATE-007: limita a una sola exposición pendiente el pago concurrente del mismo carrito"
    final_verification:
      database: hotel_test_db
      focused: "1 passed"
      payment_file: "1 passed"
      stripe_mode: mock
      real_stripe_charges: false
      concurrent_requests: 20
      http_results: "1x201, 19x409 PAYMENT_EXCEEDS_BALANCE, 0x5xx"
      payment_intents_created: 1
      local_payments: "1 procesando"
      approved_amount: "0.00"
      pending_exposure: "100.00"
      processing_exposure: "100.00"
      total_financial_exposure: "100.00"
      max_legitimate_exposure: "100.00"
      exposure_violation: false
      payment_tests: green
