  - id: QA-RH-AUTH-CANDIDATE-019
    status: closed
    severity: critical
    category: AUTH
    title: >-
      Un cliente puede autoaprobar un pago directo en efectivo de su propia
      ReservaHabitacion
    invariant: >-
      Un cliente autenticado no puede declarar unilateralmente que el hotel
      recibió efectivo. Al intentar pagar directamente su propia
      ReservaHabitacion, el backend debe responder HTTP 403 o persistir el pago
      pendiente de aprobación administrativa; el monto aprobado y neto aprobado
      deben permanecer en Q0.00 y la reserva no debe confirmarse financieramente.
    reproduction:
      phase: RED
      test_file: backend/tests/habitaciones/reservaHabitacion.cashPaymentAuth.test.ts
      test_name: "QA-RH-AUTH-CANDIDATE-019: cliente no puede autoaprobar un pago directo en efectivo"
      command: >-
        npm --prefix backend test --
        tests/habitaciones/reservaHabitacion.cashPaymentAuth.test.ts -t
        "QA-RH-AUTH-CANDIDATE-019: cliente no puede autoaprobar un pago directo
        en efectivo"
      database: hotel_test_db
      authenticated_role: cliente
      reservation_ownership: OWN
      payment_method: efectivo
      stripe_used: false
      real_charges: false
    expected:
      safe_outcome: >-
        HTTP 403, o Pago pendiente de aprobación administrativa sin dinero
        aprobado
      approved_after: "0.00"
      net_approved_after: "0.00"
      reservation_state_after: pendiente
      client_self_approved_cash_payment: false
