        menores; GTQ; sin red ni cargos reales
      webhook: "HTTP 200; payment_intent.succeeded"
      payment_after_webhook: "aprobado; Q10000.00"
      cart_after_webhook: pagado
      event_a_exposure: "approved=Q5000.00; processing=Q0.00; total=Q5000.00"
      event_b_exposure: "approved=Q5000.00; processing=Q0.00; total=Q5000.00"
