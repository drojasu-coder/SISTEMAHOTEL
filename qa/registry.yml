    processing_included: true
    approved_refunds_included: true
    locking_strategy: >-
      SELECT FOR UPDATE en orden Carrito -> ReservaHabitacion por id ascendente
      -> ReservaEvento por id ascendente -> Pago; no se bloquean los carritos
      históricos y la serialización financiera ocurre por ReservaEvento.
    second_commitment_result: >-
      ADD a C2 rechazado con HTTP 409 CART_REFERENCE_NOT_AVAILABLE; no se ejecutó
