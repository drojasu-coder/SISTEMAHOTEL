      source_of_truth: PostgreSQL
    lock_inspection:
      source_reservation_rows: >-
        Cada PATCH toma SELECT FOR UPDATE sobre su propia ReservaHabitacion de
        origen; son filas distintas y esos locks no serializan el par.
      destination_room_row: "no se observó lock en la ruta de actualización"
      conflicting_reservation_rows: >-
        La consulta de disponibilidad no toma lock sobre filas conflictivas.
      shared_serialization_lock: "ninguno observado"
      evidentiary_weight: >-
        Inspección auxiliar; la confirmación se basa exclusivamente en el estado
        final reproducido en PostgreSQL.
    suspected_execution_path: >-
      reservaHabitacion.routes -> reservaHabitacion.controller.updateReservaHabitacion
      -> reservaHabitacion.service.updateReservaHabitacion. Cada transacción
      bloquea únicamente su reserva fuente, calcula el destino, ejecuta
      validateReferences y validateOverlap para la habitación destino sin tomar
      un lock canónico compartido sobre esa habitación. Ambas transacciones
      pueden observar cero solapes antes de ejecutar sus UPDATE independientes y
      confirmar dos filas activas solapadas.
    root_cause: >-
      El PATCH ya era transaccional y bloqueaba con SELECT FOR UPDATE la
      ReservaHabitacion origen, pero dos PATCH sobre reservas origen distintas no
      compartían ese lock. La ruta de actualización usaba validateReferences,
