      pago.service ahora suma las obligaciones pendientes individuales de los
      eventos y distribuye cada Pago de carrito por los pesos persistidos de todos
      sus CarritoItem antes de atribuir únicamente la porción del tipo evento y
      referencia exactos. createPago y approveTransferencia siguen consumiendo el
      mismo eventExposureBalance corregido.
    event_cart_balance_strategy: >-
      SUM(max(0, ReservaEvento.total - eventFinancialExposure.total)) para todas
      las ReservaEvento únicas del carrito. Este límite agregado se combina con
      Math.min contra originRemaining y el límite agregado de habitaciones ya
      existente. En carritos mixtos sigue siendo una salvaguarda por categoría y
      no vuelve más restrictivo el comportamiento previo; originRemaining continúa
      siendo el límite global autoritativo del carrito.
    event_payment_allocation_strategy: >-
      Cada Pago.id deduplicado se distribuye por separado entre todos los items
      persistidos de su carrito, con peso CarritoItem.precio * cantidad. Solo se
      suma al evento la cuota de items cuyo tipo_item es exactamente evento y cuyo
      referencia_id coincide; no se mezclan espacios de ids de habitaciones,
      actividades u otros tipos. Se incluyen carritos actuales, históricos y
      expirados porque la búsqueda no filtra estado de Carrito.
    cent_based_allocation: >-
      Pago, reembolsos, pesos y cuotas se convierten a centavos enteros; la
      división proporcional usa BigInt y las cuotas siempre suman exactamente el
      monto distribuido. Un carrito con un único item ponderado le asigna el monto
      completo.
    residual_strategy: >-
      Después de truncar las cuotas proporcionales, los centavos restantes se
      entregan de a uno por CarritoItem.id ascendente. La atribución de habitaciones
      conserva su estrategia previa de mayor residuo proporcional, con desempate
      por id ascendente.
    processing_allocation: >-
      Todo el monto de cada Pago procesando se distribuye sin netear reembolsos y
      se acumula separadamente como processing.
    approved_allocation: >-
      Para estados aprobado, reembolsado_parcial y reembolsado se calcula primero
      el neto no negativo de cada Pago y después se distribuye ese neto; no se
      agregan varios pagos antes del prorrateo.
    refund_semantics: >-
      Solo Reembolso con estado aprobado reduce la exposición aprobada. Reembolsos
      pendientes o rechazados no alteran la atribución y el neto de cada Pago se
      limita a cero antes de distribuirlo.
    locking_strategy: >-
      Sin cambios: Carrito FOR UPDATE -> ReservaHabitacion por id ascendente ->
      ReservaEvento por id ascendente -> Pago/Reembolso. La ReservaEvento sigue
      siendo el lock canónico de su exposición; no se introdujeron locks en
      memoria, orden Pago -> Carrito ni checks financieros fuera de la transacción.
    final_evidence:
