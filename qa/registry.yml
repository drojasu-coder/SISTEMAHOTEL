      total_active_exposure: "200.00"
      maximum_legitimate_exposure: "100.00"
    stripe_evidence:
      mode: FULL_LOCAL_MOCK
      real_calls: 0
      payment_intent_count: 2
      first: >-
        pi_rh_aggregate_020_1; requires_payment_method; 10000 minor units;
        Q100.00; metadata reserva_habitacion_id=1,pago_id=1
      second: >-
        pi_rh_aggregate_020_2; requires_payment_method; 10000 minor units;
        Q100.00; metadata carrito_id=1,pago_id=2
      active_intent_exposure: "200.00"
    suspected_execution_path: >-
      createPago valida el pago directo y committedOrProcessingExposure consulta
      únicamente la llave reserva_habitacion_id, por lo que crea P1 y PI1 por
      Q100.00. carritoItem.resolveHabitacion solo consulta
      isReservationFullyPaid, que agrega dinero aprobado pero no el pago directo
      procesando, y permite persistir la misma referencia en el carrito. El
      segundo createPago calcula committedOrProcessingExposure únicamente con
      carrito_id=1, sin agregar la exposición directa ni la de otros carritos
      asociados a ReservaHabitacion.id, y crea P2 y PI2 por otros Q100.00.
    root_cause: >-
      El saldo se calculaba por la llave inmediata del origen de Pago. Un pago
      directo solo consultaba reserva_habitacion_id y un pago por carrito solo
      consultaba carrito_id, por lo que ambos compromisos podían reservar el
      total completo sin compartir un agregado ni un lock canónico de la
      ReservaHabitacion.
    correction: >-
      reservationFinancialExposure agrega una sola vez cada Pago directo o de
      cualquier carrito histórico/activo que contenga la ReservaHabitacion,
      suma procesando y calcula aprobado neto restando únicamente Reembolsos
      aprobados con piso cero por Pago. createPago y approveTransferencia
      bloquean la ReservaHabitacion y validan ese saldo agregado dentro de la
      misma transacción antes de persistir un compromiso. El segundo pago del
      escenario se rechaza con 409 PAYMENT_EXCEEDS_BALANCE antes de crear Pago o
      invocar Stripe.
    concurrency: >-
      El orden para carritos es Carrito -> ReservaHabitacion por id ascendente
      -> Pago/Reembolso; el origen directo comienza por ReservaHabitacion. Los
      incrementos de exposición quedan serializados por la fila canónica de la
      reserva. No se introdujo Pago -> Carrito y la regresión determinista
      QA-PAY-CONC-CANDIDATE-018 permaneció verde.
    severity_recommendation: critical
    verification:
