    actual_before_fix:
      local_failure_http_status: 502
      local_failure_code: STRIPE_PAYMENT_INTENT_FAILED
      first_intent_compensated: false
      first_intent_orphaned: true
      active_uncompensated_intents:
        - pi_orphan_001
        - pi_orphan_002
      duplicated_active_external_attempt: true
    endpoint: POST /api/pagos
    root_cause: >-
      createPago agrupaba createPaymentIntent y la persistencia de
      id_transaccion_externo en un mismo try/catch. Un fallo local posterior al
      éxito externo se clasificaba como fallo Stripe y provocaba rollback sin
      compensar el PaymentIntent recién creado.
    correction: >-
      createPago separa el fallo de creación externa del fallo local posterior.
      Si falla la asociación local, cancela únicamente el PaymentIntent creado
      por esa ejecución y, tras cancelación confirmada, responde 500
      PAYMENT_LOCAL_PERSISTENCE_FAILED conservando el error local como causa. Si
      la cancelación falla o no confirma estado canceled, responde 502
      PAYMENT_COMPENSATION_FAILED sin afirmar que la operación quedó compensada.
    protection_scope: >-
      Cubre fallos al persistir id_transaccion_externo después de crear el
      PaymentIntent y antes de completar createPago; no afirma cubrir fallos del
      commit posteriores al retorno exitoso del callback transaccional.
    regression_test:
      test_file: backend/tests/pagos/pagoActividad.orphan.test.ts
      test_name: "QA-PAY-FIN-CANDIDATE-010: evita PaymentIntent huérfano tras éxito externo y rollback local sin idempotency key"
