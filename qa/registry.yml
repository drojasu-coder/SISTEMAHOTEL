      approved_checkpoint:
        refund_state: aprobado
        payment_state: reembolsado_parcial
        approved_refunds: "40.00"
        net: "60.00"
        second_refund_capacity: "60.00"
      after_old_pending:
        refund_state: pendiente
        payment_state: aprobado
        approved_refunds: "0.00"
        net: "100.00"
        second_refund_capacity: "100.00"
      after_old_failed:
        refund_state: rechazado
        payment_state: aprobado
        approved_refunds: "0.00"
        net: "100.00"
        second_refund_capacity: "100.00"
      final:
        first_refund: "re_016_001/rechazado/40.00"
        second_refund: "re_016_002/aprobado/60.00"
        payment_state: reembolsado_parcial
        approved_refunds: "60.00"
        net: "40.00"
    demonstrated_execution:
      A_approved_refund_degraded_to_pending: true
      B_same_refund_degraded_to_rejected: true
      C_payment_and_net_regressed: true
      D_second_refund_capacity_reopened: true
    distinction_from_009: >-
      QA-PAY-DATA-CANDIDATE-009 protege el estado de Pago ante replay de
      payment_intent.succeeded y conserva intactas las filas Reembolso. Este
      hallazgo usa refund.created/refund.failed del mismo refund después de
      refund.updated succeeded; degrada la propia fila Reembolso y, al dejar de
      contarla como aprobada, revive el Pago y altera neto y capacidad.
    suspected_execution_path: >-
      processStripeWebhook identifica cualquier eventType que contiene refund,
      busca Reembolso solo por id_reembolso_externo y traduce el status recibido
      a aprobado, rechazado o pendiente. Si difiere del estado persistido ejecuta
      reembolso.update sin comprobar monotonicidad ni antigüedad del evento.
      Luego recalcula exclusivamente Reembolsos en estado aprobado; al quedar el
      refund antiguo pendiente o rechazado obtiene refunded=0 y cambia el Pago de
      reembolsado_parcial a aprobado. createReembolso usa esa suma reducida para
      calcular remaining y expone capacidad ya consumida externamente.
    root_cause: >-
      processStripeWebhook actualizaba un Reembolso siempre que el estado Stripe
      traducido difiriera del persistido. No trataba aprobado como estado terminal,
      por lo que un refund.created pendiente o refund.failed fuera de orden quitaba
      el reembolso de la suma aprobada y hacía retroceder también el estado, neto y
      capacidad financiera del Pago.
    correction: >-
      La actualización de un Reembolso existente ahora bloquea únicamente las
      transiciones aprobado->pendiente y aprobado->rechazado. pendiente->aprobado
      continúa permitido y no se alteraron las demás transiciones existentes. Al
      conservarse la fila aprobada, el recálculo transaccional mantiene el total
      reembolsado, el estado del Pago y el saldo neto correctos.
    concurrency: >-
      processStripeWebhook conserva el bloqueo FOR UPDATE de Pago antes de leer o
      actualizar el Reembolso. Todos los eventos del mismo PaymentIntent y
      createReembolso, que también bloquea primero el Pago, quedan serializados por
      esa fila; no se agregó una comprobación check-then-write fuera de la
      transacción ni se modificó el orden de locks.
    regression_test:
      test_file: backend/tests/pagos/refundOutOfOrderReplay.test.ts
      test_modified_by_fixer: false
    severity_recommendation: high
    verification:
      focused: "1 file failed, 1 test failed por la violación esperada"
