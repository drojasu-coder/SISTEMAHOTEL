    suspected_execution_path: >-
      deleteReservaHabitacion busca la ReservaHabitacion y actualiza estado a
      cancelada sin transacción, sin consultar el Pago procesando y sin cancelar
      el PaymentIntent. Cuando llega payment_intent.succeeded,
      processStripeWebhook actualiza el Pago a aprobado dentro de su transacción
      y después llama validateOpenOrigin; esta rechaza la reserva cancelada con
      RESERVATION_NOT_AVAILABLE, revierte el UPDATE del Pago y responde 409. El
      replay exacto repite el mismo rollback, por lo que Stripe permanece
      succeeded mientras PostgreSQL conserva el Pago procesando sin refund ni
      otra reconciliación durable.
    root_cause: >-
      deleteReservaHabitacion ejecutaba una lectura y un UPDATE independientes,
      sin transacción ni lock canónico sobre ReservaHabitacion, y no comprobaba
      la exposición procesando agregada antes de volver terminal la reserva. Así
      podía cancelar mientras un pago directo o de un carrito histórico seguía
      siendo cobrable.
    correction: >-
      DELETE ahora ejecuta el flujo en una transacción, toma SELECT ... FOR
      UPDATE sobre ReservaHabitacion y reutiliza reservationFinancialExposure
      antes de cambiar el estado. Si la suma procesando de pagos directos y de
      todos los carritos que contienen la reserva es mayor que cero, responde
      HTTP 409 RESERVATION_HAS_PROCESSING_PAYMENT y conserva el snapshot. No
      cancela PaymentIntent, no crea reembolsos y no modifica Pago ni webhook.
    concurrency: >-
      El orden es ReservaHabitacion -> lecturas Pago/Reembolso. El lock de la
      reserva se mantiene hasta confirmar o revertir la transacción, y serializa
      la cancelación con createPago y las demás mutaciones que usan esa misma
      fila canónica. No se añadió un orden inverso Pago -> ReservaHabitacion.
    severity_recommendation: high
