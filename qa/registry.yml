      chofer.update({ activo }) sin abrir una transacción, sin bloquear con
      SELECT FOR UPDATE la fila del Chofer y sin verificar si existían filas de
      ReservaTransporte en estado confirmada con fecha_hora posterior al momento
      actual asignadas a ese chofer.
    fix: >-
      updateStatus encapsula la verificación y la actualización dentro de
      sequelize.transaction. Adquiere bloqueo de fila con SELECT FOR UPDATE
      sobre Chofer. Si la transición solicitada es activo=true a activo=false,
      ejecuta dentro de la misma transacción una consulta sobre
      ReservaTransporte con chofer_id, estado=confirmada y fecha_hora mayor al
      momento actual (Op.gt Date). Si encuentra al menos una, revierte y arroja
      AppError(409, "DRIVER_HAS_FUTURE_RESERVATIONS"). En caso contrario,
      persiste el nuevo estado y hace commit.
    validation_layer: service
    transaction_scope: >-
      sequelize.transaction alrededor de SELECT FOR UPDATE de Chofer, consulta
      de ReservaTransporte y chofer.update
    locking_strategy: SELECT ... FOR UPDATE sobre la fila del Chofer en actualización
    future_reservation_definition: fecha_hora > NOW() (Op.gt new Date()) en reservas_transporte
    blocking_state: estado = confirmada
    automatic_cancellation: false
    automatic_unassign: false
    automatic_reassignment: false
