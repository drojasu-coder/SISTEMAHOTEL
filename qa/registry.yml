  - id: QA-PAY-DATA-CANDIDATE-009
    status: closed
    severity: medium
    category: DATA
    invariant: >-
      Repetir payment_intent.succeeded no debe cambiar a aprobado un pago que
      ya está reembolsado o reembolsado_parcial ni alterar sus reembolsos
      aprobados o su monto neto.
    reproduction:
      test_file: backend/tests/pagos/pagoWebhookRefundReplay.test.ts
      test_names:
        - "QA-PAY-DATA-CANDIDATE-009 TOTAL"
        - "QA-PAY-DATA-CANDIDATE-009 PARTIAL"
      stripe_mode: mock_local
      real_stripe_charges: false
    expected:
      total: "reembolsado -> reembolsado; reembolso 100.00; neto 0.00"
      partial: "reembolsado_parcial -> reembolsado_parcial; reembolso 40.00; neto 60.00"
    actual_before_fix:
      total: "reembolsado -> aprobado; reembolso 100.00; neto 0.00"
      partial: "reembolsado_parcial -> aprobado; reembolso 40.00; neto 60.00"
    affected_service: processStripeWebhook
    red_evidence:
      total: "1 failed, 1 skipped; esperado reembolsado, recibido aprobado"
      partial: "1 failed, 1 skipped; esperado reembolsado_parcial, recibido aprobado"
    root_cause: >-
      Para payment_intent.succeeded, target era aprobado y shouldUpdate permitía
      actualizar cualquier estado distinto de aprobado, incluidos reembolsado y
      reembolsado_parcial. Las filas de reembolso y el neto permanecían correctos,
      pero el estado persistido del pago revivía incorrectamente a aprobado.
    correction: >-
      shouldUpdate rechaza exclusivamente la transición hacia aprobado cuando el
      estado actual es reembolsado o reembolsado_parcial. Las demás transiciones,
      approvedAmount, la lógica de Reembolso y applyCartPaid permanecen sin cambios.
    concurrency: >-
      processStripeWebhook bloquea la fila Pago con FOR UPDATE dentro de la
      transacción, por lo que la decisión de transición se serializa con los flujos
      de reembolso que bloquean el mismo pago.
    regression_test:
      test_file: backend/tests/pagos/pagoWebhookRefundReplay.test.ts
      test_modified_by_fixer: false
