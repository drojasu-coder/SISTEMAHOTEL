  - id: QA-PAY-FIN-CANDIDATE-007
    status: closed
    severity: critical
    category: FIN
    invariant: >-
      Los pagos aprobados netos más la exposición de pagos con tarjeta en estado
      procesando para un mismo origen no deben superar su total; veinte intentos
      concurrentes sobre un carrito de Q100.00 solo pueden comprometer Q100.00.
    reproduction:
      test_file: backend/tests/pagos/pagoActividad.concurrency.test.ts
      test_name: "QA-PAY-FIN-CANDIDATE-007: limita a una sola exposición pendiente el pago concurrente del mismo carrito"
      command: >-
        npm test -- tests/pagos/pagoActividad.concurrency.test.ts -t
        "QA-PAY-FIN-CANDIDATE-007: limita a una sola exposición pendiente el pago concurrente del mismo carrito"
      stripe_mode: mock_local
      concurrent_requests: 20
    expected:
      successful_requests: 1
      payment_intents_created: 1
      pending_exposure: "100.00"
      approved_amount: "0.00"
      exposure_violation: false
    actual_before_fix:
      successful_requests: 20
      payment_intents_created: 20
      processing_payments: 20
      pending_exposure: "2000.00"
      approved_amount: "0.00"
      exposure_violation: true
    endpoint: POST /api/pagos
    root_cause: >-
      El bloqueo FOR UPDATE del carrito serializaba createPago, pero cada
      transacción calculaba el saldo únicamente con approvedAmount, que excluye
      correctamente pagos procesando. Después de cada commit, la siguiente
      transacción volvía a observar aprobado neto igual a cero y podía crear otro
      PaymentIntent por el saldo completo.
    correction: >-
      createPago calcula exclusivamente el monto nuevo que puede comprometer con
      un helper separado que suma el aprobado neto y pagos en estado procesando
      consultados dentro de la transacción serializada por el lock del origen, sin
      bloquear las filas procesando. No se modificó approvedAmount ni se incluyeron
      transferencias pendientes, pagos rechazados o cancelados.
    regression_test:
      test_file: backend/tests/pagos/pagoActividad.concurrency.test.ts
      test_name: "QA-PAY-FIN-CANDIDATE-007: limita a una sola exposición pendiente el pago concurrente del mismo carrito"
    final_verification:
