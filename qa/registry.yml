      future_distributed_architecture: Redis_or_gateway_WAF
    invariant: >-
      Desde una misma IP, POST /api/auth/login admite como máximo 10 solicitudes
      en 15 minutos y la solicitud 11 responde HTTP 429 TOO_MANY_REQUESTS. POST
      /api/auth/register admite como máximo 5 solicitudes en 30 minutos y la
      solicitud 6 responde HTTP 429 TOO_MANY_REQUESTS sin crear un usuario.
