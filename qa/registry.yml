    concurrency_and_locks: >-
      createPago y approveTransferencia conservan una sola transacción y el orden
      Carrito -> ReservaHabitacion por id ascendente -> ReservaEvento por id
      ascendente -> CitaBienestar por id ascendente -> Pago. wellnessExposureBalance
      reutiliza las CitaBienestar ya bloqueadas por cartTotals; la fila canónica
      de la cita serializa los compromisos entre carritos y no se añadió ningún
      orden Pago -> CitaBienestar.
    webhook_semantics: >-
