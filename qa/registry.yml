      consultar ni compensar pagos procesando del carrito histórico. Después,
      pago.controller.stripeWebhook -> pago.service.processStripeWebhook cambia
      el Pago a aprobado dentro de una transacción, pero validateOpenOrigin llama
      cartTotals; la revalidación de bienestar detecta la cita cancelada y arroja
      CART_REFERENCE_NOT_AVAILABLE, revirtiendo también la aprobación local. El
      replay recorre el mismo camino y deja la divergencia durable.
    red_result: >-
      CONFIRMED: 1 archivo falló y 1 test falló con tres aserciones de conducta
      segura; safeOutcome=false, externalLocalDivergence=true y
      financialViolation=true.
    root_cause: >-
      citaSpa.service.updateStatus leía y actualizaba CitaBienestar fuera de una
      transacción y no consultaba los Pagos procesando asociados mediante los
      carritos históricos de la cita. Por ello permitía persistir cancelada
      mientras un PaymentIntent todavía podía completarse externamente.
    fix: >-
      updateStatus ahora ejecuta una transacción administrada, obtiene la
      CitaBienestar objetivo con SELECT FOR UPDATE y, únicamente al transicionar
      hacia cancelada, consulta la exposición procesando de todos sus carritos
      históricos. Si el monto es mayor que cero revierte con HTTP 409
      RESERVATION_HAS_PROCESSING_PAYMENT. La revalidación financiera de carrito
      también bloquea las CitaBienestar referenciadas antes de validar su estado
      y antes de crear o aprobar Pago; los demás cambios de estado conservan el
      comportamiento anterior.
    validation_layer: citaSpa.service.updateStatus
    financial_exposure_helper: cartReferenceProcessingExposure
    historical_carts_included: true
    transaction_scope: >-
      BEGIN -> CitaBienestar SELECT FOR UPDATE -> lectura de CarritoItem
      histórico -> lectura de Pago estado=procesando -> rechazo y ROLLBACK, o
      CitaBienestar UPDATE y COMMIT.
    locking_strategy: >-
      Cancelación bloquea primero la CitaBienestar objetivo y después ejecuta
      lecturas sin lock de CarritoItem/Pago. createPago y approveTransferencia
      bloquean primero Carrito y, en cartTotals, bloquean secuencialmente las
      CitaBienestar únicas por ID ascendente antes de validar estado y continuar
      hacia Pago/PaymentIntent. El helper de exposición sigue siendo read-only y
      no bloquea Carrito.
    payment_serialization: >-
      La fila CitaBienestar es el recurso compartido entre cancelación y
      creación/aprobación financiera. Si cancelación obtiene el lock primero,
      persiste cancelada y el pago reanudado falla con
      CART_REFERENCE_NOT_AVAILABLE. Si el pago obtiene el lock primero, conserva
      la cita confirmada hasta persistir su compromiso y la cancelación reanudada
      detecta exposición procesando y falla con
      RESERVATION_HAS_PROCESSING_PAYMENT. Carritos mixtos deduplican IDs de
      bienestar y los bloquean secuencialmente en orden numérico ascendente.
    deadlock_analysis: >-
      No se identificó ciclo concreto: creación/aprobación por transferencia
      sigue Carrito -> referencias existentes -> CitaBienestar ascendente ->
      Pago; cancelación sigue CitaBienestar -> lecturas MVCC sin lock de
      CarritoItem/Pago y nunca intenta Carrito FOR UPDATE. Dos pagos sobre citas
      comunes toman todas las filas CitaBienestar en el mismo orden ascendente.
      El webhook Stripe conserva su orden existente Carrito -> Pago ->
      CitaBienestar, pero cancelación no intenta bloquear Pago ni Carrito, por lo
      que tampoco forma un ciclo con esta ruta; no se modificó el webhook.
    processing_rule: >-
      Solo la suma positiva de Pagos con estado procesando en cualquier carrito
      histórico bloquea la transición hacia cancelada. aprobado,
      reembolsado_parcial y reembolsado no se incorporan a esta regla; fallido,
      rechazado y cancelado tampoco bloquean. No se cambió la política de dinero
      aprobado.
