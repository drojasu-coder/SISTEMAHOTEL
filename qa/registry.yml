      authMiddleware. Para rol cliente, Factura aplica usuario_id en el WHERE de
      PostgreSQL y las consultas de FacturaItem usan un INNER JOIN requerido con
      Factura y WHERE Factura.usuario_id. Las consultas por id combinan id y
      propiedad y responden 404 cuando el recurso no está dentro del scope. Los
      demás roles autenticados conservan el acceso global previo y las mutaciones
      siguen usando helpers internos sin cambios de autorización.
