      por el total de la misma ReservaHabitacion
    invariant: >-
      El dinero aprobado neto de reembolsos más los pagos procesando, agregado
      por ReservaHabitacion.id a través del origen directo y de todos los
      carritos que contienen la referencia, nunca debe superar el total de la
      reserva. Para una reserva de Q100.00, un pago directo procesando de
      Q100.00 debe impedir un segundo compromiso activo desde carrito.
    reproduction:
      phase: RED
      scenario: A_DIRECTO_MAS_CARRITO
      test_file: backend/tests/habitaciones/reservaHabitacion.aggregateExposure.test.ts
      test_name: "QA-RH-FIN-CANDIDATE-020: pago directo y carrito agregan exposición por ReservaHabitacion sin superar su total"
      command: >-
