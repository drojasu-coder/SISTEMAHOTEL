      cart_c1: >-
        Carrito id=1; expirado; conserva CarritoItem evento referencia_id=1 por
        Q5000.00 y Pago id=1 procesando por Q5000.00 asociado a
        pi_evt_fin_035_1.
      cart_c2: >-
        Carrito id=2; activo; contiene una segunda CarritoItem evento
        referencia_id=1 por Q5000.00 y Pago id=2 procesando por Q5000.00
        asociado a pi_evt_fin_035_2.
      calculation: >-
        aprobado neto Q0.00 + procesando C1 Q5000.00 + procesando C2 Q5000.00
