      estado pendiente o confirmada. Por ello persiste mantenimiento y deja la
      reserva futura intacta y asociada.
    root_cause: >-
      updateHabitacion no tenía una regla de transición a mantenimiento ni una
      transacción que serializara esa transición con la creación o el traslado
      de reservas. Persistía estado=mantenimiento sin consultar reservas activas
      cuya fecha_salida aún fuera posterior a la fecha local del hotel.
    correction: >-
      updateHabitacion ahora ejecuta el flujo completo dentro de una transacción,
      bloquea la Habitación objetivo con SELECT FOR UPDATE y, únicamente en una
      transición efectiva hacia mantenimiento, consulta reservas de esa misma
      habitación en estado pendiente o confirmada con fecha_salida posterior a
      la fecha local actual. Ante conflicto lanza AppError HTTP 409
