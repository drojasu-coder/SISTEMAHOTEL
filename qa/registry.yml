      vehicle_capacity_after_attempt: 4
      reservation_state_after_attempt: confirmada
      reservation_passengers_after_attempt: 4
      reservation_vehicle_preserved: true
      passengers_exceed_capacity: false
      business_rule_violation: false
      041_regression: "1 file passed, 1 test passed; DRIVER_OVERLAP_COUNT=1, VEHICLE_OVERLAP_COUNT=1"
      042_regression: "1 file passed, 1 test passed; 409 DRIVER_HAS_FUTURE_RESERVATIONS"
      related_transport_tests: "3 files passed, 3 tests passed"
