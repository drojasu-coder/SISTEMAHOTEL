      carrito_id o reserva_habitacion_id, y valores de estado, metodo y
      tipo_pago dentro de sus dominios. Toda fila de reembolsos debe tener monto
      mayor que cero y estado dentro de su dominio, incluso ante escrituras
      internas o directas que no pasan por validadores HTTP ni servicios.
