  - id: QA-ADMIN-EVENT-SAL-UX-008
    status: corrected
    manual_revalidation: pending
    severity: medium
    category: UX
    invariant: >-
      Eliminar un salón debe requerir un diálogo propio que identifique el salón,
      permita cancelar sin DELETE, ejecute una sola solicitud al confirmar,
      impida cierre o doble envío mientras está pendiente y mantenga el diálogo
      y la lista ante 409 o 5xx con mensajes seguros y comprensibles.
    reproduction:
      phase: RED
      test_file: Frontend/src/features/eventos/AdminSalones.test.tsx
      test_names:
        - "reemplaza window.confirm por el diálogo con título, texto y acciones exactas"
        - "Cancelar cierra el diálogo sin hacer DELETE"
        - "hace un solo DELETE tras confirmar, bloquea duplicados y refresca la lista al completar"
        - "un 409 explica que el salón está en uso y conserva todos los elementos"
        - "un 500 muestra un mensaje genérico y conserva la lista"
      command: >-
        npm --prefix Frontend test -- src/features/eventos/AdminSalones.test.tsx
      endpoint: DELETE /api/salones/{id}
    expected:
      native_confirm_calls: 0
      dialog_title: "Eliminar salón"
      selected_room_preserved: true
      duplicate_delete_calls: 0
      conflict_message: "mensaje 409 del backend dentro del diálogo"
      server_error_message: "mensaje genérico de getApiErrorMessage"
    actual_before_fix:
      confirmation: window.confirm
      selected_room_state: absent
      in_dialog_error: absent
      accessible_modal: absent
      red_result: "5 failed, 0 passed en el bloque 008; suite total 11 failed, 2 passed"
    root_cause: >-
      AdminSalonesList ejecutaba DELETE tras window.confirm y enviaba los errores
      a una alerta global. No existía estado del salón seleccionado ni un ciclo
      modal capaz de conservar contexto, bloquear duplicados o presentar 409 y
      5xx sin abandonar la confirmación.
    correction: >-
      Se añadió SalonDeleteConfirmModal sobre el Modal común y el listado conserva
      el salón seleccionado y el error de la operación. Cancelar y X no ejecutan
      DELETE; mientras la mutación está pendiente se bloquean confirmación,
      cancelación y cierre. El éxito cierra tras una única solicitud y conserva
      la invalidación existente; 409 muestra el mensaje controlado y 5xx pasa por
      getApiErrorMessage sin quitar elementos de la lista.
    concurrency: >-
      La interfaz comprueba isPending antes de mutar y deshabilita las acciones,
      evitando doble DELETE desde el mismo diálogo. Esto no pretende sustituir
      la autorización ni la protección EVENT_ROOM_IN_USE del backend; no se
      alteraron transacciones, constraints ni el servicio de eliminación.
    regression_test:
      test_file: Frontend/src/features/eventos/AdminSalones.test.tsx
      backend_test_file: backend/tests/eventos/salon.admin.test.ts
