      payment_rows: 2
      direct_payment: >-
        id=1; reserva_habitacion_id=1; carrito_id=null; tarjeta; procesando;
        Q100.00; id_transaccion_externo=pi_rh_aggregate_020_1
      cart_payment: >-
        id=2; reserva_habitacion_id=null; carrito_id=1; tarjeta; procesando;
        Q100.00; id_transaccion_externo=pi_rh_aggregate_020_2
