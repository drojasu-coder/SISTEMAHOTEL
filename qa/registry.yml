      reservation_state_after: confirmada
      approved_after: "100.00"
      net_approved_after: "100.00"
      admin_approval_involved: false
      client_self_approved_cash_payment: true
      authorization_violation: true
      red_result: "1 file failed, 1 test failed; 6 assertions de autorización y estado financiero fallaron"
    endpoint: POST /api/pagos
    http_evidence:
      reservation_create_status: 201
      payment_attempt_status: 201
      payment_attempt_code: null
      unexpected_500: false
    database_evidence:
      before_payment:
        reservation_usuario_id_matches_authenticated_client: true
        reservation_state: pendiente
        reservation_total: "100.00"
        approved_amount: "0.00"
        net_approved: "0.00"
      after_payment:
        payment_rows: 1
        payment_method: efectivo
        payment_state: aprobado
        payment_amount: "100.00"
        payment_date: "2026-10-22T08:07:11.142Z"
        payment_date_present: true
        reservation_state: confirmada
        approved_amount: "100.00"
        net_approved: "100.00"
    suspected_execution_path: >-
      pago.routes permite POST /api/pagos a cualquier usuario autenticado y
      pago.controller.create delega en createPago. Después de validar ownership
      de la reserva propia, createPago trata metodo=efectivo como aprobado,
      persiste estado aprobado y fecha_pago inmediatamente y ejecuta
      confirmReservationIfFullyPaid, sin exigir rol administrativo ni una
      aprobación posterior para acreditar la recepción física del efectivo.
    severity_recommendation: critical
    root_cause: >-
      createPago distinguía el estado financiero únicamente por metodo y
