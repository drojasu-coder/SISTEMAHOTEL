      el peso persistido precio*cantidad. La aritmética y distribución del
      residuo se realizan en centavos, ordenados por CarritoItem.id; las cuotas de
      todos los items bienestar que referencian la cita se suman sin atribuir el
      Pago completo a cada referencia.
    obligation_source: >-
