      therapist_for_update_in_update_status: false
      overlap_check_in_update_status: false
    suspected_execution_path: >-
      PATCH /api/citas-spa/{id}/estado atraviesa autenticación, autorización
      admin, validación, citaSpa.controller.updateStatus y
      citaSpa.service.updateStatus. El servicio abre una transacción y bloquea
      únicamente la fila de CitaBienestar objetivo con SELECT FOR UPDATE, pero
      al pasar de cancelada a confirmada no bloquea la fila Terapeuta ni repite
      la consulta de solape y buffer usada por create; actualiza estado
      directamente, permitiendo que A y B queden confirmadas en la misma
      ventana.
    red_result: >-
      CONFIRMED: el test enfocado falló con PATCH HTTP 200, A y B confirmadas y
      dos filas incompatibles persistidas; no hubo respuestas HTTP 500.
    confirmed_at: "2026-10-25"
    root_cause: >-
      updateStatus serializaba la CitaBienestar objetivo para proteger la
      cancelación financiera de 047, pero cualquier transición desde un estado
      distinto hacia confirmada actualizaba directamente la fila. No bloqueaba
      el Terapeuta, no validaba que existiera y estuviera activo ni reutilizaba
      el predicado de solape con buffer empleado por create, por lo que una cita
      cancelada podía reactivarse sobre otra cita confirmada incompatible.
    fix: >-
      Se extrajo una única validación de disponibilidad que conserva el rango y
      las comparaciones estrictas de CREATE. CREATE y reactivación usan ahora el
      mismo predicado. Al reactivar, updateStatus mantiene el lock de la cita,
      obtiene el Terapeuta asociado con SELECT FOR UPDATE, aplica los mismos
      errores de existencia/actividad de CREATE, consulta solo citas confirmadas
      con buffer de 15 minutos excluyendo el ID objetivo y actualiza el estado
      únicamente cuando la ventana sigue disponible.
    validation_layer: citaSpa.service.updateStatus
    shared_overlap_helper: assertTherapistAvailability
    reactivation_rule: >-
      Solo cuando estado solicitado es confirmada y el estado persistido actual
      no es confirmada se serializa el Terapeuta y se revalida su ventana
      almacenada fecha/hora_inicio/hora_fin. Un conflicto responde HTTP 409
      THERAPIST_BUSY_OR_BUFFER y la transacción conserva la cita en su estado
      previo; no se cambian campos temporales ni recursos y no se cancela ni
      reasigna la cita competidora.
    therapist_serialization: >-
      La reactivación obtiene Terapeuta con SELECT FOR UPDATE dentro de la misma
      transacción que bloqueó la CitaBienestar objetivo, consulta solapes y
      actualiza el estado. CREATE conserva Terapeuta SELECT FOR UPDATE antes de
      consultar solapes e insertar, por lo que ambos flujos compiten sobre la
      misma fila canónica del terapeuta.
    therapist_missing_http: 404
