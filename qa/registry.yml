    category: FIN
    title: >-
      Eventos Stripe antiguos degradan un reembolso aprobado y reabren saldo
    invariant: >-
      Un Reembolso aprobado por un evento Stripe válido no puede degradarse a
      pendiente o rechazado cuando después llega un evento antiguo o fuera de
      orden del mismo refund. El estado financiero debe ser monotónico: para un
      pago de Q100.00 con reembolso parcial aprobado de Q40.00 deben conservarse
      pago reembolsado_parcial, neto Q60.00 y capacidad de segundo reembolso
      Q60.00.
