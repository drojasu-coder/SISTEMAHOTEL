      exposure_before: >-
        PostgreSQL y eventFinancialExposure: approved=Q0.00,
        processing=Q5000.00, total=Q5000.00.
    expected:
      preferred_cancellation: >-
        HTTP 409 RESERVATION_HAS_PROCESSING_PAYMENT; ReservaEvento permanece en
