      payment_intents_created: 1
      local_payments: "1 procesando"
      approved_amount: "0.00"
      pending_exposure: "100.00"
      processing_exposure: "100.00"
      total_financial_exposure: "100.00"
      max_legitimate_exposure: "100.00"
      exposure_violation: false
      payment_tests: green
