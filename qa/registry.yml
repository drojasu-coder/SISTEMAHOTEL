      el total con los ítems actuales y applyCartPaid marca pagado el carrito que ya
      contiene B.
    root_cause: >-
      create y remove serializaban la mutación mediante el bloqueo UPDATE del carrito,
      pero no consultaban la exposición financiera persistida después de adquirir ese
      bloqueo. Por ello permitían cambiar los ítems aunque existiera un Pago del mismo
      carrito en estado procesando.
    correction: >-
      Ambos caminos de mutación reutilizan una única guarda financiera dentro de la
      transacción. Después de bloquear y autorizar el carrito, la guarda consulta Pago
      por carrito_id y estado procesando y responde 409 CART_HAS_PROCESSING_PAYMENT
      antes de crear o eliminar un CarritoItem. No se agregó snapshot ni dependencia
      de Stripe.
    severity_recommendation: high
    regression_test:
      test_file: backend/tests/pagos/pagoCartMutationBinding.test.ts
      preserved_red: true
