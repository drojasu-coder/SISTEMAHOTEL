    status: closed
    severity: medium
    category: SECURITY
    title: >-
      Login y registro públicos carecen de límite de solicitudes por IP
    approved_product_rule:
      login: { max_requests: 10, window_minutes: 15 }
      register: { max_requests: 5, window_minutes: 30 }
      scope: { key: IP }
      response: { http: 429, code: TOO_MANY_REQUESTS }
