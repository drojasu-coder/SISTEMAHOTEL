# HOTEL HUNAHPÚ — fallback SPA del frontend (React Router) para nginx en EC2.
#
# Es un FRAGMENTO de locations, no un server completo: no define listen,
# server_name, certificados TLS ni el proxy /api, que siguen en la
# configuración existente del servidor. Instalación manual:
#
#   1. Copiar Frontend/dist al directorio que ya usa `root` en el server HTTPS.
#   2. Dentro de ese bloque `server { ... }`, reemplazar el `location /`
#      actual (si existe) por:   include /etc/nginx/snippets/hotel-hunahpu-spa.locations.conf;
#   3. nginx -t && systemctl reload nginx
#
# Requisitos/compatibilidad:
#   - Un `location /api/ { proxy_pass ...; }` existente tiene prioridad sobre
#     `location /` por ser un prefijo más largo; las regex de este archivo están
#     anidadas en `location /` y no afectan a /api.
#   - No debe existir otro `location /` en el mismo server (nginx -t lo rechaza).

# Archivos con hash generados por Vite: caché larga e inmutable.
location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# index.html no se cachea para que cada despliegue llegue de inmediato.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Rutas de React Router (/legal/privacidad, /admin/reportes, /mis-reservas/...)
# devuelven index.html con 200 al recargar o abrir el enlace directamente.
location / {
    # Un archivo estático inexistente con extensión sigue respondiendo 404.
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }
    try_files $uri $uri/ /index.html;
}
