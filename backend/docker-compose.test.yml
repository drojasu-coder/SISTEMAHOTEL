services:
  postgres-test:
    image: postgres:16
    container_name: hotel_postgres_test
    environment:
      POSTGRES_USER: hotel_test_user
      POSTGRES_PASSWORD: hotel_test_password
      POSTGRES_DB: hotel_test_db
    ports:
      - "55432:5432"
    volumes:
      - hotel_pg_test_data:/var/lib/postgresql/data

volumes:
  hotel_pg_test_data:
